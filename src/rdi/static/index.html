<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Robot Data Integrator · LLM 智能决策工作区</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d1117;--bg-sidebar:#010409;--border:#30363d;--text:#e6edf3;
  --text-dim:#8b949e;--text-faint:#6e7681;--accent:#f78166;
  --font-ui:"IBM Plex Sans","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg);color:var(--text);font-family:var(--font-ui);
  display:flex;flex-direction:column;overflow:hidden;
}
#root{flex:1;min-height:0}
#root .placeholder{
  height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
  color:var(--text-faint);gap:14px;font-size:14px;
}
#root .placeholder .logo{
  width:52px;height:52px;border-radius:14px;background:linear-gradient(135deg,#f78166,#d29922);
  display:grid;place-items:center;color:#0d1117;font-size:26px;font-weight:700;
}
.goalbar{
  display:flex;align-items:center;gap:12px;padding:14px 28px;
  border-top:1px solid var(--border);background:var(--bg-sidebar);flex-shrink:0;
}
.goal-add{
  width:40px;height:40px;border-radius:10px;border:1px solid var(--border);
  background:var(--bg);color:var(--text-dim);font-size:20px;line-height:1;
  cursor:pointer;flex-shrink:0;display:grid;place-items:center;transition:.15s;
}
.goal-add:hover{border-color:var(--accent);color:var(--accent)}
.goal-add.has-file{color:var(--accent);border-color:var(--accent)}
.goal-input{
  flex:1;background:var(--bg);border:1px solid var(--border);border-radius:10px;
  padding:11px 14px;font-family:var(--font-ui);font-size:14px;color:var(--text);
  outline:none;transition:.15s;
}
.goal-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(247,129,102,.12)}
.goal-input::placeholder{color:var(--text-faint)}
.goal-run{
  background:var(--accent);color:#0d1117;border:none;padding:11px 22px;border-radius:10px;
  font-family:var(--font-ui);font-size:14px;font-weight:600;cursor:pointer;transition:.15s;flex-shrink:0;
}
.goal-run:hover{filter:brightness(1.08)}
.goal-run:disabled{opacity:.55;cursor:not-allowed}
.controls{background:var(--bg-sidebar);border-top:1px solid var(--border);padding:0 28px;flex-shrink:0}
.controls summary{cursor:pointer;color:var(--text-dim);font-size:12px;padding:10px 0;user-select:none}
.controls .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding-bottom:14px}
.controls .field{display:flex;flex-direction:column;gap:5px}
.controls .field.full{grid-column:1 / -1}
.controls label{font-size:12px;color:var(--text-faint)}
.controls select,.controls textarea{
  width:100%;background:var(--bg);border:1px solid var(--border);border-radius:8px;
  color:var(--text);padding:8px 10px;font-size:13px;font-family:var(--font-ui);outline:none;
}
.controls textarea{resize:vertical;min-height:52px}
</style>
</head>
<body>

<div id="root">
  <div class="placeholder">
    <div class="logo">R</div>
    <div>Robot Data Integrator — LLM 智能决策工作区</div>
    <div>在下方输入实验目标，点击「▶ 运行」开始</div>
  </div>
</div>

<div class="goalbar">
  <button class="goal-add" id="pdfBtn" title="上传论文 PDF">＋</button>
  <input class="goal-input" id="goalInput" placeholder="描述你的实验目标，如：整合 DexGrasp 抓取数据与灵巧手 URDF…">
  <button class="goal-run" id="runBtn">▶ 运行</button>
</div>
<input type="file" id="pdfFile" accept=".pdf" hidden>

<details class="controls">
  <summary>审查与设置</summary>
  <div class="grid">
    <div class="field">
      <label>运行模式</label>
      <select id="modeSel">
        <option value="真实流程" selected>真实流程</option>
        <option value="演示流程">演示流程</option>
      </select>
    </div>
    <div class="field">
      <label>审查决定</label>
      <select id="reviewSel">
        <option value="satisfied" selected>satisfied（满意）</option>
        <option value="revised">revised（修订）</option>
        <option value="unsatisfied">unsatisfied（不满意）</option>
      </select>
    </div>
    <div class="field full">
      <label>反馈</label>
      <textarea id="feedback" placeholder="审查反馈（可选）"></textarea>
    </div>
    <div class="field full">
      <label>本地文件注入（JSON：{"req_id": "路径"}）</label>
      <textarea id="localFiles" placeholder='{"req_id": "C:/path/to/file"}'></textarea>
    </div>
  </div>
</details>

<script>
const root = document.getElementById('root');
const runBtn = document.getElementById('runBtn');
const goalInput = document.getElementById('goalInput');
const pdfBtn = document.getElementById('pdfBtn');
const pdfFile = document.getElementById('pdfFile');
const modeSel = document.getElementById('modeSel');
const reviewSel = document.getElementById('reviewSel');
const feedback = document.getElementById('feedback');
const localFiles = document.getElementById('localFiles');

let pdfBase64 = null;
let running = false;

const PANEL_TITLES = {explorer:'资源管理器', retrieve:'数据检索', decision:'决策', review:'审查', log:'日志', settings:'设置'};
const STAGE_TO_NODE = {retrieve_data:0, parse_and_convert:1, validate:2, assemble_package:3, human_review:4};

// 活动栏 / 检查器切换（事件委托，内容被 innerHTML 替换后仍生效）
document.addEventListener('click', (e) => {
  const act = e.target.closest('.rdi-act');
  if (act && root.contains(act)) {
    root.querySelectorAll('.rdi-act').forEach(x => x.classList.remove('active'));
    act.classList.add('active');
    const p = act.getAttribute('data-panel');
    root.querySelectorAll('.rdi-sidebar .rdi-pane').forEach(n => {
      n.style.display = (n.getAttribute('data-panel') === p) ? '' : 'none';
    });
    const titleEl = root.querySelector('#rdi-panel-title');
    if (titleEl) titleEl.textContent = PANEL_TITLES[p] || '';
  }
  const tab = e.target.closest('.rdi-tab');
  if (tab && root.contains(tab)) {
    root.querySelectorAll('.rdi-tab').forEach(x => x.classList.remove('active'));
    tab.classList.add('active');
    const k = tab.getAttribute('data-tab');
    root.querySelectorAll('.rdi-insp-pane').forEach(n => {
      n.style.display = (n.getAttribute('data-tab') === k) ? '' : 'none';
    });
  }
  const group = e.target.closest('.rdi-group');
  if (group && root.contains(group)) {
    const gchildren = group.nextElementSibling;
    if (gchildren) {
      const gchev = group.querySelector('.rdi-tree-chev');
      if (gchildren.style.display === 'none') {
        gchildren.style.display = 'block';
        if (gchev) gchev.textContent = '▾';
      } else {
        gchildren.style.display = 'none';
        if (gchev) gchev.textContent = '▸';
      }
    }
  }
  const pkg = e.target.closest('.rdi-pkg');
  if (pkg && root.contains(pkg)) {
    const children = pkg.nextElementSibling;
    if (!children) return;
    const chev = pkg.querySelector('.rdi-tree-chev');
    if (children.style.display === 'none') {
      children.style.display = 'block';
      if (chev) chev.textContent = '▾';
      if (!children.dataset.loaded) {
        children.dataset.loaded = '1';
        loadPackageTree(pkg.getAttribute('data-group'), pkg.getAttribute('data-package'), children);
      }
    } else {
      children.style.display = 'none';
      if (chev) chev.textContent = '▸';
    }
  }
});

async function loadPackageTree(group, packageId, container) {
  try {
    const resp = await fetch(`/api/package/tree?group=${encodeURIComponent(group)}&package_id=${encodeURIComponent(packageId)}`);
    const data = await resp.json();
    container.innerHTML = data.error ? '加载失败' : data.html;
  } catch (err) {
    container.innerHTML = '加载失败';
  }
}

pdfBtn.addEventListener('click', () => pdfFile.click());
pdfFile.addEventListener('change', async () => {
  const f = pdfFile.files[0];
  if (!f) return;
  pdfBase64 = await fileToBase64(f);
  pdfBtn.textContent = '📎';
  pdfBtn.classList.add('has-file');
});

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(',')[1]);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

runBtn.addEventListener('click', () => {
  if (running) return;
  running = true;
  if (runBtn.textContent.includes('继续运行')) resume();
  else run();
});

async function run() {
  const goal = goalInput.value.trim();
  if (!goal) { alert('请输入实验目标'); running = false; return; }
  runBtn.textContent = '运行中…';
  runBtn.disabled = true;
  try {
    const resp = await fetch('/api/run', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        mode: modeSel.value,
        goal: goal,
        paper_pdf: pdfBase64,
        local_files: localFiles.value,
      }),
    });
    const data = await resp.json();
    const taskId = data.task_id;
    await pollUntilDone(taskId);
  } finally {
    running = false;
    runBtn.disabled = false;
  }
}

async function pollUntilDone(taskId) {
  while (true) {
    const stResp = await fetch(`/api/status/${taskId}`);
    const st = await stResp.json();
    if (st.error) { alert(st.error); return; }
    if (st.done) break;
    updateRunningStage(st.stage_progress || []);
    await sleep(500);
  }
  const resResp = await fetch(`/api/result/${taskId}`);
  const res = await resResp.json();
  if (res.error) { alert(res.error); return; }
  const result = res.result;
  renderBoard(result[10], false);
  runBtn.textContent = String(result[0] || '').includes('继续运行') ? '▶ 继续运行' : '▶ 运行';
}

async function resume() {
  runBtn.textContent = '继续中…';
  runBtn.disabled = true;
  try {
    const resp = await fetch('/api/resume', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ review_decision: reviewSel.value, feedback: feedback.value }),
    });
    const data = await resp.json();
    const result = data.result;
    renderBoard(result[10], false);
    runBtn.textContent = '▶ 运行';
  } catch (e) {
    alert('继续运行失败：' + e.message);
  } finally {
    running = false;
    runBtn.disabled = false;
  }
}

function updateRunningStage(stageProgress) {
  // 运行期间保留工作区，只更新灯带节点点亮状态
  const stops = root.querySelectorAll('.rdi-wf-stop');
  if (stops.length === 0) return;
  let maxDone = -1;
  (stageProgress || []).forEach(s => {
    const idx = STAGE_TO_NODE[s];
    if (idx !== undefined && idx > maxDone) maxDone = idx;
  });
  const current = maxDone + 1;
  stops.forEach((s, i) => {
    s.classList.remove('rdi-wf-current', 'rdi-wf-done');
    if (i <= maxDone) s.classList.add('rdi-wf-done');
    else if (i === current) s.classList.add('rdi-wf-current');
  });
}

function renderBoard(html, animate = true) {
  root.innerHTML = html;
  if (animate) animateWorkflow();
}

function animateWorkflow() {
  const stops = root.querySelectorAll('.rdi-wf-stop');
  if (stops.length === 0) return;
  // 逐个点亮（模拟流程推进），最终停在当前阶段
  const total = stops.length;
  const target = Math.max(0, total - 1);
  for (let i = 0; i <= target; i++) {
    setTimeout(() => {
      stops.forEach((s, j) => {
        s.classList.remove('rdi-wf-current', 'rdi-wf-done');
        if (j < i) s.classList.add('rdi-wf-done');
        else if (j === i) s.classList.add('rdi-wf-current');
      });
    }, i * 220);
  }
}

// 三栏拖拽调宽（事件委托，内容被替换后仍生效）
document.addEventListener('mousedown', (e) => {
  const resizer = e.target.closest('.rdi-resizer');
  if (!resizer || !root.contains(resizer)) return;
  const target = resizer.getAttribute('data-target');
  const panel = root.querySelector(target === 'sidebar' ? '.rdi-sidebar' : '.rdi-inspector');
  if (!panel) return;
  const dir = resizer.getAttribute('data-dir');
  const startX = e.clientX;
  const startW = panel.offsetWidth;
  const min = parseInt(panel.getAttribute('data-min') || '180', 10);
  const max = parseInt(panel.getAttribute('data-max') || '520', 10);
  document.body.style.cursor = 'col-resize';
  document.body.style.userSelect = 'none';
  const onMove = (ev) => {
    const dx = ev.clientX - startX;
    const w = dir === 'right' ? startW + dx : startW - dx;
    panel.style.width = Math.min(Math.max(w, min), max) + 'px';
  };
  const onUp = () => {
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onUp);
    document.body.style.cursor = '';
    document.body.style.userSelect = '';
  };
  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup', onUp);
  e.preventDefault();
});

async function loadInitialWorkspace() {
  try {
    const resp = await fetch('/api/workspace');
    const data = await resp.json();
    renderBoard(data.html, false);
  } catch (e) {
    // 初始加载失败时保留占位
  }
}
loadInitialWorkspace();
</script>
</body>
</html>
