[project]
name = "robot-data-integrator"
version = "0.1.0"
description = "面向机器人操作与抓取领域的多源异构数据智能整合系统"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "挑战杯团队", email = "team@example.com" },
]
dependencies = [
    # LLM
    "openai>=1.50.0",
    # 编排
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    # 向量库
    "chromadb>=0.5.0",
    # 数据模型
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    # HTTP
    "aiohttp>=3.9.0",
    "httpx>=0.27.0",
    # 网页解析
    "beautifulsoup4>=4.12",
    # 机器人
    "trimesh>=4.0.0",
    "lxml>=5.0.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    # PDF
    "pymupdf>=1.24.0",
    # 前端
    "gradio>=4.0.0",
    # 配置与日志
    "structlog>=24.0.0",
    "python-dotenv>=1.0.0",
    # 工具
    "PyYAML>=6.0",
]
[project.optional-dependencies]
# 运行时验证（MuJoCo 加载 + 一步仿真），体积较大故作为可选组
runtime = [
    "mujoco>=2.3",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "respx>=0.20.0",
    "factory-boy>=3.3.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
    "ipython>=8.20.0",
    "yourdfpy>=0.0.60",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rdi"]

# ─── Ruff 配置 ───
[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "A", "SIM", "TCH"]
ignore = ["E501"]  # 行宽由 formatter 管

[tool.ruff.lint.isort]
known-first-party = ["rdi"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ─── mypy 配置 ───
[tool.mypy]
python_version = "3.13"
mypy_path = "src"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
explicit_package_bases = true
# 与 CI（uv run mypy src）口径一致：仅对 src 做严格类型检查，tests 由 CI 的 ruff/pytest 覆盖
exclude = "tests/"

[[tool.mypy.overrides]]
module = "trimesh.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "chromadb.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "openai.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "fitz.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "lxml.*"
ignore_missing_imports = true

# mujoco 为可选依赖（runtime extra），CI 环境不安装，import 缺失由 override 放行
[[tool.mypy.overrides]]
module = "mujoco"
ignore_missing_imports = true

# ─── pytest 配置 ───
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short --strict-markers -m 'not integration'"
markers = [
    "unit: 单元测试",
    "integration: 集成测试",
    "e2e: 端到端测试",
    "slow: 标记为慢测试（可跳过）",
]

# ─── coverage 配置 ───
[tool.coverage.run]
source = ["src/rdi"]
omit = ["tests/*", "*/__init__.py"]

[tool.coverage.report]
fail_under = 0
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
